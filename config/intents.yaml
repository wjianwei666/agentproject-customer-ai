version: "1.0"

default_intent: other

# 规则打分：命中一个关键词记 weight 分，命中数越多置信度越高。
# 置信度 = min(0.95, 0.45 + 0.12 * score)
confidence_base: 0.45
confidence_step: 0.12
confidence_cap: 0.95

