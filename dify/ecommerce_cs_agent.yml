# =============================================================================
# 电商智能客服 Agent｜Dify 工作流 DSL
# =============================================================================
# 用途：Dify 工作室 → 创建应用 → 导入 DSL 文件
# 适配：Dify 0.15.x / 1.x 的 workflow 模式
#
# 说明：
# 1. 节点、变量名与 docs/06-Agent节点拆解与架构时序.md 的对照表严格一致；
# 2. 提示词内容与 prompts/*.md 保持同源，改提示词请两边同步；
# 3. 若因 Dify 版本差异导致导入失败，按 docs/07 第 5.2 节的手工节点清单重建，
#    30 分钟即可完成，节点顺序与下方完全一致。
# 4. 导入后必须按顺序做三件事（缺任一步都会导致演示失败）：
#    a) 先建知识库：把 knowledge/faq.md 上传为数据集，并把数据集 ID 填到
#       「知识检索」节点的 dataset_ids（为空则 N4 恒为空召回）；
#    b) 绑定模型凭据（默认 langgenius/openai/openai + gpt-4o-mini）；
#    c) 跑一条转人工用例（如「杯子破损，我要投诉」）确认 need_human=true。
#
# 5. 配置双真相源说明（重要）：
#    代码版（src/）的画像规则读 config/personas.yaml、合规规则读 config/compliance.yaml；
#    Dify 版的同等规则内嵌在「标签人群匹配」「合规质检」「兜底替换」三个代码节点里。
#    改规则时：走代码版改 yaml，走 Dify 改节点代码，两边都改则需人工核对一致性。
#
# 6. 完整节点链路（共 18 个节点、19 条边）：
#    开始 → N1 脱敏 → N2 意图 → N3 画像 → N4 检索 → N5 生成 → N6 质检
#         → N6 分支 →（命中）N6.5 整改#1 → N6 复查 →（仍命中）N6.5 整改#2
#         → N6.9 本地兜底 → N7 转人工决策 ←（未命中/复查通过也汇入 N7）
#         → N7 分支 →（转人工）N8 工单摘要 → 结束-转人工
#                    →（自动应答）结束-自动应答
# =============================================================================

app:
  name: 电商智能客服 Agent
  description: 意图识别 → 标签人群匹配 → 知识检索 → 话术生成 → 合规质检 → 转人工兜底
  mode: workflow
  icon: 🤖
  icon_background: '#E0F2FE'
  use_icon_as_answer_icon: false

kind: app
version: 0.1.5

dependencies: []

workflow:
  conversation_variables: []
  environment_variables: []

  features:
    file_upload:
      allowed_file_extensions: []
      allowed_file_types: []
      allowed_file_upload_methods: []
      enabled: false
      number_limits: 3
    opening_statement: ''
    retriever_resource:
      enabled: true
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false

  graph:
    nodes:

      # ---------------------------------------------------------------- 开始
      - id: start
        type: custom
        position:
          x: 80
          y: 320
        positionAbsolute:
          x: 80
          y: 320
        width: 244
        height: 116
        sourcePosition: right
        targetPosition: left
        data:
          type: start
          title: 开始
          desc: 接收用户消息与用户标签
          variables:
            - variable: user_message
              label: 用户消息
              type: text-input
              required: true
              max_length: 512
              options: []
            - variable: user_tags
              label: 用户标签(JSON)
              type: text-input
              required: false
              max_length: 2048
              options: []

      # ------------------------------------------------------------ 入参脱敏
      - id: code_redact
        type: custom
        position:
          x: 400
          y: 320
        positionAbsolute:
          x: 400
          y: 320
        width: 244
        height: 116
        sourcePosition: right
        targetPosition: left
        data:
          type: code
          title: 入参脱敏
          desc: 证件号与手机号在进入任何模型前隐藏，避免隐私落盘
          code_language: python3
          variables:
            - variable: user_message
              value_selector:
                - start
                - user_message
          code: |
            import re

            # 顺序不可调换：先匹配 18 位证件号，再匹配 11 位手机号
            IDCARD_RE = re.compile(r"\d{18}")
            PHONE_RE = re.compile(r"\d{11}")


            def main(user_message: str) -> dict:
                text = (user_message or "").strip()
                clean = IDCARD_RE.sub("【证件号已隐藏】", text)
                clean = PHONE_RE.sub("【手机号已隐藏】", clean)
                return {
                    "clean_message": clean,
                    "redacted": "true" if clean != text else "false",
                }
          outputs:
            clean_message:
              type: string
              children: null
            redacted:
              type: string
              children: null

      # ------------------------------------------------------------ 意图识别
      - id: llm_intent
        type: custom
        position:
          x: 720
          y: 320
        positionAbsolute:
          x: 720
          y: 320
        width: 244
        height: 116
        sourcePosition: right
        targetPosition: left
        data:
          type: llm
          title: 意图识别
          desc: 从 8 类意图中选择唯一最匹配项，只输出意图 id
          model:
            provider: langgenius/openai/openai
            name: gpt-4o-mini
            mode: chat
            completion_params:
              temperature: 0
          prompt_template:
            - role: system
              text: |
                你是电商客服意图分类器。请从下列意图中选择唯一最匹配的一个，
                只输出意图 id，不要输出解释、标点或多余文字。

                意图列表：
                - product_consult：售前商品咨询（选型、参数、材质、适用场景）
                - price_promo：价格与优惠（折扣、券、满减、到手价）
                - order_query：订单查询（订单状态、支付、扣款）
                - logistics：物流配送（发货、时效、单号、签收）
                - refund_return：退换货（退货、退款、换货、无理由）
                - quality_issue：商品质量问题（破损、漏发、错发、瑕疵、色差）
                - invoice：发票开具（开票、抬头、税号、报销）
                - complaint：投诉与维权（态度、欺骗、差评、举报）
                - other：其他或闲聊（问候、转人工、无明确诉求）

                判定优先级：投诉/维权 > 质量问题 > 退换货 > 物流 > 订单 > 价格 > 售前 > 其他。
                当用户同时表达多个诉求时，取情绪最强烈、损失最直接的那一个。
            - role: user
              text: '{{#code_redact.clean_message#}}'
          variables: []
          vision:
            enabled: false

      # -------------------------------------------------------- 标签人群匹配
      - id: code_persona
        type: custom
        position:
          x: 1040
          y: 320
        positionAbsolute:
          x: 1040
          y: 320
        width: 244
        height: 116
        sourcePosition: right
        targetPosition: left
        data:
          type: code
          title: 标签人群匹配
          desc: 7 维标签规则打分，取最高分画像，无命中回落兜底人群
          code_language: python3
          variables:
            - variable: intent_id
              value_selector:
                - llm_intent
                - text
            - variable: user_tags
              value_selector:
                - start
                - user_tags
          code: |
            import json

            # 与 config/personas.yaml 保持同源；实际部署建议改成从外部配置读取
            PERSONAS = [
                {"id": "vip_loyal_high", "name": "高价值忠诚VIP", "rules": [
                    {"field": "value_level", "op": "equals", "value": "high", "weight": 40},
                    {"field": "member_level", "op": "in", "value": ["V4", "V5"], "weight": 30},
                    {"field": "lifecycle", "op": "equals", "value": "active", "weight": 20},
                    {"field": "intent", "op": "in", "value": ["price_promo", "product_consult"], "weight": 15},
                ], "strategy": {
                    "tone": "尊贵、克制、先结论后补充", "address": "尊敬的会员",
                    "focus": "第一句直接给结论；主动叠加专属权益；大额诉求升级专属客服",
                    "perks": "会员专属券包、免运费特权、专属客服通道",
                    "taboos": "不要使用亲/宝子等泛化称呼；不要引导比价；不要推销低价商品",
                    "closing": "主动确认是否需要安排专属顾问继续跟进", "max_discount": 0.15,
                }},
                {"id": "price_sensitive_new", "name": "价格敏感新客", "rules": [
                    {"field": "lifecycle", "op": "equals", "value": "new", "weight": 40},
                    {"field": "price_sensitivity", "op": "equals", "value": "sensitive", "weight": 35},
                    {"field": "source", "op": "in", "value": ["live", "search"], "weight": 20},
                    {"field": "intent", "op": "in", "value": ["price_promo", "product_consult"], "weight": 15},
                ], "strategy": {
                    "tone": "热情、直白、给确定性数字", "address": "亲",
                    "focus": "先给明确价格区间再给省钱路径；用到手价替代打折表述；强调低价不等于低质",
                    "perks": "新人首单立减、满减券包、运费险",
                    "taboos": "不要使用全网最低/史上最低等绝对化用语；不要承诺超权限折扣；不要贬低竞品",
                    "closing": "给出下单入口，并提示券的有效期", "max_discount": 0.10,
                }},
                {"id": "anxious_urgent", "name": "焦虑催单型", "rules": [
                    {"field": "emotion", "op": "equals", "value": "anxious", "weight": 40},
                    {"field": "intent", "op": "in", "value": ["logistics", "order_query"], "weight": 35},
                    {"field": "lifecycle", "op": "in", "value": ["active", "new"], "weight": 10},
                ], "strategy": {
                    "tone": "稳定、安抚、先共情再给确定时间", "address": "您",
                    "focus": "第一句共情第二句给具体节点时间；主动提供单号与查询路径；异常件主动给补偿",
                    "perks": "优先派送、运费券、延迟补偿",
                    "taboos": "不要使用应该/大概/可能等模糊词；不要归咎物流方；不要承诺精确到小时",
                    "closing": "给出主动跟进承诺并设置回访节点", "max_discount": 0.05,
                }},
                {"id": "angry_complaint", "name": "愤怒维权型", "rules": [
                    {"field": "emotion", "op": "equals", "value": "angry", "weight": 45},
                    {"field": "intent", "op": "in", "value": ["complaint", "quality_issue", "refund_return"], "weight": 35},
                    {"field": "value_level", "op": "in", "value": ["high", "medium"], "weight": 10},
                ], "strategy": {
                    "tone": "诚恳、低姿态、不辩解、只给方案", "address": "您",
                    "focus": "第一句直接道歉不解释；一次性给完整解决方案；明确责任人与处理时限",
                    "perks": "全额退款、免费补发、补偿券",
                    "taboos": "不要反问用户；不要使用按规定/公司要求等推责表述；不要承诺法定之外的赔偿倍数",
                    "closing": "给出工单号与专属处理人，主动告知下一步时间", "max_discount": 0.20,
                }},
                {"id": "rational_researcher", "name": "理性比价研究型", "rules": [
                    {"field": "price_sensitivity", "op": "in", "value": ["neutral", "insensitive"], "weight": 30},
                    {"field": "intent", "op": "equals", "value": "product_consult", "weight": 35},
                    {"field": "service_pref", "op": "equals", "value": "self_service", "weight": 25},
                ], "strategy": {
                    "tone": "客观、结构化、给参数与依据", "address": "您",
                    "focus": "用要点列表回答；给可验证依据；不回避产品短板",
                    "perks": "延长保修、免费试用装",
                    "taboos": "不要使用夸张形容；不要回避缺点；不要编造参数",
                    "closing": "给出规格对比页与售后条款链接", "max_discount": 0.05,
                }},
                {"id": "silent_recall", "name": "沉默流失预警", "rules": [
                    {"field": "lifecycle", "op": "in", "value": ["silent", "churn_risk"], "weight": 45},
                    {"field": "intent", "op": "in", "value": ["price_promo", "product_consult", "other"], "weight": 20},
                ], "strategy": {
                    "tone": "轻打扰、价值导向、不制造压力", "address": "您",
                    "focus": "一条消息只给一个钩子；用专享回归权益替代清仓打折；提供低门槛回流动作",
                    "perks": "回归专享券、老客价保",
                    "taboos": "不要连续追问为什么不买；不要制造焦虑；不要群发式话术",
                    "closing": "给一次性可领取权益，领取即结束对话", "max_discount": 0.12,
                }},
            ]

            FALLBACK = {
                "tone": "中性、简洁、礼貌", "address": "您",
                "focus": "先回答用户明确问题，再补充一条相关信息；信息不足时反问一个关键问题",
                "perks": "标准售后服务",
                "taboos": "不要使用绝对化用语；不要承诺未确认的时效",
                "closing": "询问是否还需要其他帮助", "max_discount": 0.05,
            }

            THRESHOLD = 45


            def rule_hit(rule, fields):
                actual = fields.get(rule["field"])
                if actual is None:
                    return False
                op, expected = rule.get("op", "equals"), rule["value"]
                if op == "equals":
                    return str(actual) == str(expected)
                if op == "in":
                    return str(actual) in [str(v) for v in expected]
                if op == "not_in":
                    return str(actual) not in [str(v) for v in expected]
                return False


            def main(intent_id: str, user_tags: str) -> dict:
                try:
                    tags = json.loads(user_tags) if user_tags else {}
                except (ValueError, TypeError):
                    tags = {}
                fields = dict(tags)
                fields["intent"] = (intent_id or "").strip().strip('`"\'。.').lower()

                best, best_score, best_hits = None, 0.0, []
                for persona in PERSONAS:
                    score = 0.0
                    hits = []
                    for rule in persona["rules"]:
                        if rule_hit(rule, fields):
                            score += float(rule["weight"])
                            hits.append(f'{rule["field"]}={fields.get(rule["field"])}')
                    if score > 0 and score > best_score:
                        best, best_score, best_hits = persona, score, hits

                if best is not None and best_score >= THRESHOLD:
                    return {
                        "persona_id": best["id"],
                        "persona_name": best["name"],
                        "persona_score": best_score,
                        "persona_strategy": json.dumps(best["strategy"], ensure_ascii=False),
                        "matched_rules": "；".join(best_hits),
                    }

                return {
                    "persona_id": "general_fallback",
                    "persona_name": "通用兜底人群",
                    "persona_score": best_score,
                    "persona_strategy": json.dumps(FALLBACK, ensure_ascii=False),
                    "matched_rules": "兜底",
                }
          outputs:
            persona_id:
              type: string
              children: null
            persona_name:
              type: string
              children: null
            persona_score:
              type: number
              children: null
            persona_strategy:
              type: string
              children: null
            matched_rules:
              type: string
              children: null

      # ------------------------------------------------------------ 知识检索
      - id: kb_retrieval
        type: custom
        position:
          x: 1360
          y: 320
        positionAbsolute:
          x: 1360
          y: 320
        width: 244
        height: 116
        sourcePosition: right
        targetPosition: left
        data:
          type: knowledge-retrieval
          title: 知识检索
          desc: 按脱敏后的用户消息召回 Top3 知识片段（必须绑定 knowledge/faq.md 数据集）
          dataset_ids: []
          retrieval_mode: multiple
          query_variable_selector:
            - code_redact
            - clean_message
          multiple_retrieval_config:
            top_k: 3
            score_threshold: 0.15
            score_threshold_enabled: true
            reranking_enable: false
            reranking_mode: null
            weights: null

      # ------------------------------------------------------------ 话术生成
      - id: llm_reply
        type: custom
        position:
          x: 1680
          y: 320
        positionAbsolute:
          x: 1680
          y: 320
        width: 244
        height: 116
        sourcePosition: right
        targetPosition: left
        data:
          type: llm
          title: 话术生成
          desc: 按画像语气 + 意图 + 知识片段生成回复
          model:
            provider: langgenius/openai/openai
            name: gpt-4o-mini
            mode: chat
            completion_params:
              temperature: 0.3
          prompt_template:
            - role: system
              text: |
                你是电商平台的一线智能客服。回复必须同时满足以下三个约束。

                【约束一：人设与语气】
                当前用户画像：{{#code_persona.persona_name#}}
                画像策略（含语气/称呼/沟通重点/可给权益/禁区/收尾动作/优惠上限）：
                {{#code_persona.persona_strategy#}}

                【约束二：事实边界】
                只能使用下方「知识片段」中的事实，不得编造任何时效、价格、政策、参数。
                知识片段中没有的信息，必须回答"我核实后回复您"，并给出下一步动作。
                优惠力度不得超过策略中的 max_discount，超出必须引导至人工客服。

                【约束三：合规红线】命中任意一条即不合格
                - 不使用绝对化用语（最好、第一、全网最低、100%、永久）；
                - 不承诺超出平台规则的赔付（假一赔十、全额赔付）；
                - 不贬低竞品，不索取用户隐私（身份证、银行卡、验证码）；
                - 非医疗商品不得宣称治疗、治愈、根治等功效。

                【结构要求】
                1. 第一句给结论或共情，禁止铺垫；
                2. 正文 2-4 句，用事实说话；
                3. 最后一句给明确的下一步动作；
                4. 总长度 60-180 字。

                【当前意图】
                {{#llm_intent.text#}}

                【知识片段】
                {{#kb_retrieval.result#}}
            - role: user
              text: |
                【用户原话】
                {{#code_redact.clean_message#}}

                请按 System 约束生成回复。
          variables: []
          vision:
            enabled: false

      # ------------------------------------------------------------ 合规质检
      - id: code_guard
        type: custom
        position:
          x: 2000
          y: 320
        positionAbsolute:
          x: 2000
          y: 320
        width: 244
        height: 116
        sourcePosition: right
        targetPosition: left
        data:
          type: code
          title: 合规质检
          desc: block 级规则命中则判定不可下发
          code_language: python3
          variables:
            - variable: reply
              value_selector:
                - llm_reply
                - text
          code: |
            import re

            # 与 config/compliance.yaml 同源，只保留 block 级规则
            BLOCK_RULES = [
                {"id": "absolute_wording", "name": "绝对化用语",
                 "patterns": ["最好", "最强", "第一品牌", "全网最低", "史上最低", "100%", "绝对", "永久", "唯一", "顶级", "国家级"]},
                {"id": "over_promise_compensation", "name": "超额赔付承诺",
                 "patterns": ["假一赔十", "十倍赔偿", "无条件赔偿", "全额赔付", "包赔", "赔十倍"]},
                {"id": "competitor_defamation", "name": "贬低竞品",
                 "patterns": ["别家都是假货", "其他家都是假的", "同行都坑人", "那家是骗子"]},
                {"id": "privacy_risk", "name": "隐私与账号风险",
                 "patterns": ["身份证号", "银行卡号", "密码", "验证码发我"]},
                {"id": "medical_claim", "name": "功效违规宣称",
                 "patterns": ["治疗", "治愈", "根治", "药效", "疗效"]},
            ]


            def main(reply: str) -> dict:
                text = reply or ""
                issues = []
                for rule in BLOCK_RULES:
                    for pattern in rule["patterns"]:
                        if re.search(pattern, text):
                            issues.append(f'{rule["name"]}({rule["id"]})：命中「{pattern}」')
                            break
                return {
                    "has_block": "true" if issues else "false",
                    "issues": "；".join(issues) if issues else "无",
                    "block_count": len(issues),
                }
          outputs:
            has_block:
              type: string
              children: null
            issues:
              type: string
              children: null
            block_count:
              type: number
              children: null

      # ------------------------------------------------------------ 合规分支
      - id: if_compliance
        type: custom
        position:
          x: 2320
          y: 320
        positionAbsolute:
          x: 2320
          y: 320
        width: 244
        height: 116
        sourcePosition: right
        targetPosition: left
        data:
          type: if-else
