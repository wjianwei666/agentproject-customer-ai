            - variable: persona_score
              value_selector:
                - code_persona
                - persona_score
            - variable: need_human
              value_selector:
                - code_handoff
                - need_human
            - variable: handoff_reason
              value_selector:
                - code_handoff
                - handoff_reason
            - variable: ticket_summary
              value_selector: []

      # ------------------------------------------------------------ 结束（转人工）
      - id: end_handoff
        type: custom
        position:
          x: 4240
          y: 760
        positionAbsolute:
          x: 4240
          y: 760
        width: 244
