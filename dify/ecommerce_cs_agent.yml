      # -------------------------------------------------------- 工单摘要
      - id: code_ticket
        type: custom
        position:
          x: 3920
          y: 760
        positionAbsolute:
          x: 3920
          y: 760
        width: 244
        height: 116
        sourcePosition: right
        targetPosition: left
        data:
          type: code
          title: 工单摘要
          desc: 为人工坐席生成一屏可读的工单摘要（画像/意图/原因/诉求/建议动作）
          code_language: python3
          variables:
            - variable: need_human
              value_selector:
                - code_handoff
                - need_human
            - variable: handoff_reason
              value_selector:
                - code_handoff
                - handoff_reason
            - variable: intent_id
              value_selector:
                - code_handoff
                - intent_id
            - variable: intent_confidence
              value_selector:
                - code_handoff
                - intent_confidence
            - variable: persona_name
              value_selector:
                - code_persona
                - persona_name
            - variable: persona_score
              value_selector:
                - code_persona
                - persona_score
            - variable: persona_strategy
              value_selector:
                - code_persona
                - persona_strategy
            - variable: user_tags
              value_selector:
                - start
                - user_tags
            - variable: clean_message
              value_selector:
                - code_redact
                - clean_message
          code: |
            import json


            def main(need_human, handoff_reason, intent_id, intent_confidence,
                     persona_name, persona_score, persona_strategy, user_tags,
                     clean_message) -> dict:
                if str(need_human).lower() != "true":
                    return {"ticket_summary": ""}
                try:
                    tags = json.loads(user_tags) if user_tags else {}
                except (TypeError, ValueError):
                    tags = {}
                try:
                    strategy = json.loads(persona_strategy) if persona_strategy else {}
                except (TypeError, ValueError):
                    strategy = {}
                user_id = tags.get("user_id") or "匿名用户"
                closing = strategy.get("closing") or "请人工客服介入处理"
                return {
                    "ticket_summary": (
                        f"用户{user_id}｜画像：{persona_name}({persona_score}分)"
                        f"｜意图：{intent_id}({intent_confidence})"
                        f"｜转人工原因：{handoff_reason}"
                        f"｜诉求原文：{(clean_message or '')[:60]}"
                        f"｜建议动作：{closing}"
                    )
                }
          outputs:
            ticket_summary:
              type: string
              children: null

      # ------------------------------------------------------------ 结束（正常）
