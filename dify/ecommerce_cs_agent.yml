        sourcePosition: right
        targetPosition: left
        data:
          type: end
          title: 结束-转人工
          desc: 下发转人工话术 + 工单摘要，前端据此弹出人工入口
          outputs:
            - variable: reply
              value_selector:
                - code_handoff
                - final_reply
            - variable: intent_id
              value_selector:
