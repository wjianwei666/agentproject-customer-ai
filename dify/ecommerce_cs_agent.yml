                2. 删除超出平台规则的赔付承诺，改为"按平台售后规则处理"；
                3. 删除任何贬低竞品、索取隐私、宣称医疗功效的表述；
                4. 保留原文的事实信息、语气人设与下一步动作，不要新增任何未在原文出现的事实；
                5. 不得超出优惠授权上限。

                本次命中的问题：
                {{#code_guard.issues#}}

                只输出改写后的回复正文，不要输出解释、对比说明或 JSON。
            - role: user
