            name: gpt-4o-mini
            mode: chat
            completion_params:
              temperature: 0.2
          prompt_template:
            - role: system
              text: |
                你是电商平台的合规审核员。上一轮整改后仍存在违规表述，请再做一次最小必要改写。

                改写要求：
                1. 删除所有绝对化用语，改为可验证的相对表述；
                2. 删除超出平台规则的赔付承诺，改为"按平台售后规则处理"；
                3. 删除贬低竞品、索取隐私、宣称医疗功效的表述；
                4. 保留事实信息与下一步动作，不得新增未出现的事实；
                5. 若某句话无法在不违规的前提下保留，直接删除整句。

                仍未消除的问题：
                {{#code_guard_r2.issues#}}

                只输出改写后的回复正文。
            - role: user
              text: '{{#llm_fix.text#}}'
          variables: []
          vision:
            enabled: false

      # -------------------------------------------------------- 本地兜底替换
      - id: code_sanitize
        type: custom
        position:
          x: 3280
          y: 760
        positionAbsolute:
          x: 3280
          y: 760
        width: 244
        height: 116
        sourcePosition: right
        targetPosition: left
        data:
          type: code
          title: 本地兜底替换
          desc: 模型整改两轮仍失败时的确定性替换，保证有文案可下发
          code_language: python3
          variables:
            - variable: reply
              value_selector:
                - llm_fix_r2
                - text
          code: |
            import re

            REPLACEMENTS = {
                "全网最低": "同价位较优",
                "史上最低": "同价位较优",
                "第一品牌": "知名品牌",
                "假一赔十": "按平台售后规则处理",
                "十倍赔偿": "按平台售后规则处理",
                "无条件赔偿": "按平台售后规则处理",
                "全额赔付": "按平台售后规则处理",
                "包赔": "按平台售后规则处理",
                "赔十倍": "按平台售后规则处理",
                "最好": "比较合适",
                "最强": "较强",
                "顶级": "较高",
                "国家级": "行业级",
                "绝对": "基本",
                "永久": "长期",
                "唯一": "少有的",
                "100%": "高概率",
                "别家都是假货": "不同渠道各有差异",
                "其他家都是假的": "不同渠道各有差异",
                "同行都坑人": "不同渠道各有差异",
                "那家是骗子": "不同渠道各有差异",
                "请把验证码发我": "请注意保护验证码",
                "验证码发我": "注意保护验证码",
            }

            # 无法替换的隐私/医疗表述，直接删除所在短句
            DROP_PATTERNS = ["身份证号", "银行卡号", "密码", "治疗", "治愈", "根治", "药效", "疗效"]

            SAFE_REPLY = "这个问题需要人工客服为您进一步核实，请稍等，我们会尽快与您联系。"

            # 兜底后再跑一次与「合规质检」同源的 block 规则，确保下发文案干净
            BLOCK_PATTERNS = [
                "最好", "最强", "第一品牌", "全网最低", "史上最低", "100%", "绝对",
                "永久", "唯一", "顶级", "国家级",
                "假一赔十", "十倍赔偿", "无条件赔偿", "全额赔付", "包赔", "赔十倍",
                "别家都是假货", "其他家都是假的", "同行都坑人", "那家是骗子",
                "身份证号", "银行卡号", "密码", "验证码发我",
                "治疗", "治愈", "根治", "药效", "疗效",
            ]


            def main(reply: str) -> dict:
                text = reply or ""
                for bad, good in REPLACEMENTS.items():
                    text = text.replace(bad, good)
                if any(p in text for p in DROP_PATTERNS):
                    parts = re.split(r"[，。；！？]", text)
                    kept = [s for s in parts if s and not any(p in s for p in DROP_PATTERNS)]
                    text = "，".join(kept) + "。"
                # 全部句子都被删除时给安全兜底文案，绝不返回空字符串
                if not text.strip("，。；！？ \n"):
                    text = SAFE_REPLY
                remaining = [p for p in BLOCK_PATTERNS if p in text]
                return {
                    "text": text,
                    "block_count": len(remaining),
                    "sanitized": "true",
                }
          outputs:
            text:
              type: string
              children: null
            block_count:
              type: number
              children: null
            sanitized:
              type: string
              children: null

      # -------------------------------------------------------- 转人工决策
      - id: code_handoff
        type: custom
        position:
          x: 3600
          y: 540
        positionAbsolute:
          x: 3600
          y: 540
        width: 244
        height: 116
        sourcePosition: right
        targetPosition: left
        data:
          type: code
          title: 转人工决策
          desc: 汇总合规各分支的回复定稿，并按置信度/高危意图/情绪判定是否转人工
          code_language: python3
          variables:
            - variable: intent_raw
              value_selector:
                - llm_intent
                - text
            - variable: persona_id
              value_selector:
                - code_persona
                - persona_id
            - variable: knowledge
              value_selector:
                - kb_retrieval
                - result
            - variable: block_count_1
              value_selector:
                - code_guard
                - block_count
            - variable: block_count_2
              value_selector:
                - code_guard_r2
                - block_count
            - variable: block_count_3
              value_selector:
                - code_sanitize
                - block_count
            - variable: reply_original
              value_selector:
                - llm_reply
                - text
            - variable: reply_fix1
              value_selector:
                - llm_fix
                - text
            - variable: reply_fix2
              value_selector:
                - llm_fix_r2
                - text
            - variable: reply_sanitized
              value_selector:
                - code_sanitize
                - text
          code: |
            KNOWN_INTENTS = [
                "product_consult", "price_promo", "order_query", "logistics",
                "refund_return", "quality_issue", "invoice", "complaint", "other",
            ]
            HANDOFF_INTENTS = ["complaint", "quality_issue"]
            MIN_CONFIDENCE = 0.45
            HANDOFF_REPLY = (
                "非常抱歉，这个问题需要由人工客服为您处理。已为您生成工单，"
                "专属客服将在 30 分钟内与您联系，您也可以直接点击下方「转人工」按钮。"
            )


            def _num(value):
                try:
                    return int(value)
                except (TypeError, ValueError):
                    return None


            def _has_knowledge(chunks):
                if chunks is None:
                    return False
                if isinstance(chunks, (list, tuple, dict, set)):
                    return len(chunks) > 0
                return bool(str(chunks).strip())


            def main(intent_raw, persona_id, knowledge, block_count_1, block_count_2,
                     block_count_3, reply_original, reply_fix1, reply_fix2,
                     reply_sanitized) -> dict:
                intent_id = (intent_raw or "").strip().strip('`"\'。. ').lower()
                confidence = 0.85 if intent_id in KNOWN_INTENTS else 0.30

                # 取最后一次执行过的质检结果；未执行的分支变量为 None
                latest_block = 0
                for value in (block_count_3, block_count_2, block_count_1):
                    parsed = _num(value)
                    if parsed is not None:
                        latest_block = parsed
                        break

                reason = None
                if latest_block > 0:
                    reason = "compliance_unresolved"
                elif confidence < MIN_CONFIDENCE:
                    reason = "low_intent_confidence"
                elif intent_id in HANDOFF_INTENTS and not _has_knowledge(knowledge):
                    reason = "high_risk_intent_without_knowledge"
                elif (persona_id or "") == "angry_complaint":
                    reason = "angry_user_escalation"

                # 回复定稿优先级：本地兜底 > 整改#2 > 整改#1 > 原始
                final_reply = reply_original or ""
                for candidate in (reply_fix1, reply_fix2, reply_sanitized):
                    if candidate:
                        final_reply = candidate
                if reason is not None:
                    final_reply = HANDOFF_REPLY

                return {
                    "final_reply": final_reply,
                    "need_human": "true" if reason else "false",
                    "handoff_reason": reason or "none",
                    "intent_id": intent_id,
                    "intent_confidence": confidence,
                }
          outputs:
            final_reply:
              type: string
              children: null
            need_human:
              type: string
              children: null
            handoff_reason:
              type: string
              children: null
            intent_id:
              type: string
              children: null
            intent_confidence:
              type: number
              children: null

      # -------------------------------------------------------- 转人工分支
      - id: if_handoff
        type: custom
        position:
          x: 3920
          y: 540
        positionAbsolute:
          x: 3920
          y: 540
        width: 244
        height: 116
        sourcePosition: right
        targetPosition: left
        data:
          type: if-else
          title: 转人工分支
          desc: need_human 为 true 走工单与人工，否则直接下发
          cases:
